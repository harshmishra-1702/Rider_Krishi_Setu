name: rider_app
description: KrishiSetu Rider App — Rural Logistics Partner (SIH 26033)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.1

  # Network
  dio: ^5.4.3
  web_socket_channel: ^2.4.5

  # Local Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Location & Maps
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Camera & QR
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.2

  # TTS
  flutter_tts: ^4.0.2

  # Permissions
  permission_handler: ^11.3.1

  # UI Utilities
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.20.3

  # Utils
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
